# ---------------------------------------------------------------------------
# Zensical builds ONLY the API reference from this file (it reads mkdocs.yml
# as is), and it is deployed as the `/reference/` subtree of the MyST site.
# The home page, theory pages, usage guides and notebooks are built by mystmd
# from `docs/myst.yml`. See `docs/README.md` for the split and the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: finitevolX API reference
site_description: API reference for finitevolX, finite volume operators for JAX on Arakawa C-grids, generated from NumPy-style docstrings.
site_author: Juan Emmanuel Johnson, Takaya Uchida
repo_url: https://github.com/jejjohnson/finitevolX
repo_name: jejjohnson/finitevolX

docs_dir: docs/api
site_dir: site

# The guide pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead, across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  # Zensical's Material-compatible look; `modern` is its newer default.
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/gridax-jax/src, packages/gridax/src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            preload_modules:
              - spectraldiffx
              - gridax

nav:
  - Overview: index.md
  - Grids and masks:
      - Grids: grids.md
      - Analysis kernels (gridax): analysis.md
      - Masks: masks.md
      - Vertical modes: vertical_modes.md
  - Stencils and operators:
      - Raw stencils: stencils.md
      - Difference: difference.md
      - Interpolation: interpolation.md
      - Divergence: divergence.md
      - Vorticity: vorticity.md
      - Diffusion: diffusion.md
      - Coriolis: coriolis.md
      - Forcing: forcing.md
      - Momentum advection: momentum.md
      - Diagnostics: diagnostics.md
  - Advection:
      - Advection: advection.md
      - Reconstruction: reconstruction.md
  - Boundary conditions: boundary_conditions.md
  - Time integration: time_integration.md
  - Elliptic solvers:
      - Convenience wrappers: elliptic.md
      - Spectral solvers: spectral_solvers.md
      - Spectral transforms: spectral_transforms.md
      - Capacitance method: capacitance.md
      - Iterative solvers: iterative.md
      - Multigrid: multigrid.md
  - pipekit operators: pipekit.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
