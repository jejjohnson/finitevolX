[project]
name = "finitevolx"
version = "0.2.0"
description = "Deprecated: finitevolX is now gridax-jax (import gridax_jax) on gridax."
authors = [
    { name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com" },
    { name = "Takaya Uchida", email = "roxyboy.guppy@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["finite-volume", "arakawa", "jax"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# The finitevolx distribution is a deprecated shim for one 0.X release: the
# code is gridax-jax (packages/gridax-jax, import gridax_jax) on gridax
# (packages/gridax, import gridax). `import finitevolx` warns and re-exports.
dependencies = [
    "gridax-jax>=0.1.0",
    "gridax>=0.0.0",
]

# gaussx provides the shared solver substrate: the Nyström preconditioner and
# the tridiagonal solve are delegated to it.
# This repository is a uv workspace: the root project (finitevolx) and
# packages/gridax, the NumPy-only grid and mask package it builds on.
[tool.uv.workspace]
members = ["packages/gridax", "packages/gridax-jax"]

[tool.uv.sources]
gridax = { workspace = true }
gridax-jax = { workspace = true }
spectraldiffx = { git = "https://github.com/jejjohnson/spectraldiffx.git", tag = "0.1.1" }
gaussx = { git = "https://github.com/jejjohnson/gaussx", tag = "v0.6.5" }
# integrix owns the generic time steppers. Its own gaussx pin (v0.6.12) is
# replaced by the override below; integrix does not import gaussx at run time.
integrix = { git = "https://github.com/jejjohnson/integrix", tag = "v0.0.3" }
# pipekit is a uv workspace: consume its packages from git subdirectories.
# Every source is pinned to the one tag `pipekit-ops-v0.2.1` (ops 0.2.1,
# cycle 0.1.0, jax 0.1.0); per-package tags make uv report conflicting URLs
# for pipekit-ops. pipekit-cycle comes in through pipekit-jax.
pipekit-ops = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-ops", tag = "pipekit-ops-v0.2.1" }
pipekit-cycle = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-cycle", tag = "pipekit-ops-v0.2.1" }
pipekit-jax = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-jax", tag = "pipekit-ops-v0.2.1" }

# spectraldiffx pins its own gaussx git tag (v0.1.0 at spectraldiffx 0.1.1),
# which uv treats as a conflicting URL for the same package. Override it so
# finitevolX and spectraldiffx resolve one gaussx. spectraldiffx 0.1.1 still
# calls gaussx.DiagonalisedOperator, a deprecated alias in v0.6.5 that gaussx
# 0.7.0 removes: do not move this override to gaussx >= 0.7 before a
# spectraldiffx release renames that call. Drop the override once a
# spectraldiffx release pins gaussx >= v0.6.5.
[tool.uv]
override-dependencies = [
    "gaussx @ git+https://github.com/jejjohnson/gaussx@v0.6.5",
]

[project.urls]
Repository = "https://github.com/jejjohnson/finitevolX"

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-pretty>=1.2.0",
    "pytest-xdist>=3.5.0",
    "networkx>=3.3",
    "coverage>=7.6.0",
    "matplotlib>=3.9.0",
    "pillow>=11.0.0",
    "xarray>=2025.1.0",
    "zarr>=3.1.5",
]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
    "nbstripout>=0.7.1",
    "ty>=0.0.23",
]
examples = [
    "cyclopts>=2.0.0",
    "loguru>=0.7.2",
    "matplotlib>=3.9.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "tqdm>=4.66.0",
    "xarray>=2025.1.0",
    "zarr>=3.1.5",
]
pipekit = [
    # Tier-B operator layer, `gridax_jax.pipekit` (pipekit Operators over
    # the C-grid primitives). `import gridax_jax` never imports these.
    "gridax-jax[pipekit]",
]
docs = [
    # The prose half of the site (theory pages, usage guides and the example
    # notebooks) is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. Zensical (the successor to
    # Material for MkDocs, which reached end of life on 2026-11-05) builds only
    # the API reference from mkdocs.yml; its `objects.inv` is what lets the MyST
    # prose cross-reference into it. See docs/README.md.
    "zensical>=0.0.74",
    "mkdocstrings[python]>=1.0.8",
    # scripts/build_docs.py converts the jupytext notebooks to .ipynb for
    # mystmd, builds both halves and checks their links.
    "jupytext>=1.16",
    "cyclopts>=4",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "finitevolx[dev,test]",
]

[tool.pytest.ini_options]
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["tests", "packages/gridax/tests"]
xfail_strict = true
addopts = "--strict-markers"
# Tiers (see tests/conftest.py).  Unmarked tests are the fast tier.
markers = [
    "slow: correct but expensive (> ~1 s): convergence sweeps, large grids, high-order gradients, solver builds",
    "integration: end-to-end runs (example scripts, plugin worked example, full time integrations)",
]

[tool.ruff]
fix = false
line-length = 88
target-version = "py312"
exclude = ["docs/", "notebooks/"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "PLE",    # pylint errors
    "PLR",    # pylint refactor
    "PLW",    # pylint warnings
    "PIE",    # misc lints
    "PYI",    # flake8-pyi
    "TID",    # tidy imports
    "ISC",    # implicit string concatenation
    "RUF",    # ruff-specific rules
]
ignore = [
    "E402",     # module level import not at top of file
    "E731",     # do not assign a lambda expression, use a def
    "E501",     # line too long (handled by formatter)
    "S101",     # use of assert
    "F722",     # syntax error in forward annotation
    "E741",     # ambiguous variable name
    "E743",     # ambiguous function name
    "F821",     # undefined name (false positives with jaxtyping)
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR2004",  # magic value comparison
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "ISC001",   # conflicts with formatter
    "UP037",    # jaxtyping shape strings must remain quoted
    "RUF002",   # ambiguous unicode characters in docstrings
    "RUF022",   # __all__ is not sorted (we use logical grouping)
    "RUF046",   # int(round(...)) is intentional
    "PYI061",   # Literal style preference
]
unfixable = ["ERA001", "F841", "T201", "T203"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-return-type = "ignore"
unresolved-import = "ignore"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["gridax_jax", "gridax", "finitevolx"]

[tool.coverage.xml]
output = "reports/coverage.xml"
