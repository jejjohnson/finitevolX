# The workspace root: never built or published. It holds the development
# environment (the gridax package with both extras, plus the test, dev, docs
# and example dependencies) and the tool config. The library is gridax
# (packages/gridax, import gridax).
[project]
name = "gridax-workspace"
version = "0.0.0"
description = "Development workspace for gridax; not published."
requires-python = ">=3.12,<3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "gridax[jax,pipekit]",
]

[tool.uv]
package = false
# spectraldiffx (v0.8.0 at spectraldiffx 0.1.2) and integrix (v0.6.12) pin
# their own gaussx git tags, which uv treats as conflicting URLs for the same
# package. Override them so gridax, spectraldiffx and integrix resolve
# one gaussx: v0.8.1, the first release with the multigrid, known-value and
# convergence-report solves (#474). spectraldiffx 0.1.2 is the first release
# that runs on gaussx >= 0.7 (spectraldiffx#175).
override-dependencies = [
    "gaussx @ git+https://github.com/jejjohnson/gaussx@v0.8.1",
    # spectraldiffx 0.1.2 pins functax v0.0.6 and integrix 0.0.9 pins
    # v0.0.11; resolve the newer one, on which spectraldiffx's suite passes.
    "functax[jax] @ git+https://github.com/jejjohnson/functax@v0.0.11",
]

[tool.uv.workspace]
members = ["packages/gridax"]

[tool.uv.sources]
gridax = { workspace = true }
# geophysix owns the physical constants, Coriolis and the linear equation of state (#446).
geophysix = { git = "https://github.com/jejjohnson/geophysix", tag = "v0.0.3" }
spectraldiffx = { git = "https://github.com/jejjohnson/spectraldiffx.git", tag = "0.1.2" }
gaussx = { git = "https://github.com/jejjohnson/gaussx", tag = "v0.8.1" }
# integrix owns the time steppers, semi-Lagrangian advection included (0.0.9).
# Its own gaussx pin (v0.6.12) is replaced by the override above; integrix
# does not import gaussx at run time.
integrix = { git = "https://github.com/jejjohnson/integrix", tag = "v0.0.9" }
# pipekit is a uv workspace: consume its packages from git subdirectories.
# Every source is pinned to the one tag `pipekit-ops-v0.2.1` (ops 0.2.1,
# cycle 0.1.0, jax 0.1.0); per-package tags make uv report conflicting URLs
# for pipekit-ops. pipekit-cycle comes in through pipekit-jax.
pipekit-ops = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-ops", tag = "pipekit-ops-v0.2.1" }
pipekit-cycle = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-cycle", tag = "pipekit-ops-v0.2.1" }
pipekit-jax = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-jax", tag = "pipekit-ops-v0.2.1" }

[project.optional-dependencies]
test = [
    # The tests call diffrax and integrix.march directly.
    "diffrax>=0.6.0",
    "integrix>=0.0.9",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-pretty>=1.2.0",
    "pytest-xdist>=3.5.0",
    "networkx>=3.3",
    "coverage>=7.6.0",
    "matplotlib>=3.9.0",
    "pillow>=11.0.0",
    "xarray>=2025.1.0",
    "zarr>=3.1.5",
]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
    "nbstripout>=0.7.1",
    "ty>=0.0.23",
]
examples = [
    "cyclopts>=2.0.0",
    "loguru>=0.7.2",
    "matplotlib>=3.9.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "tqdm>=4.66.0",
    "xarray>=2025.1.0",
    "zarr>=3.1.5",
]
docs = [
    # The prose half of the site (theory pages, usage guides and the example
    # notebooks) is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. Zensical (the successor to
    # Material for MkDocs, which reached end of life on 2026-11-05) builds only
    # the API reference from mkdocs.yml; its `objects.inv` is what lets the MyST
    # prose cross-reference into it. See docs/README.md.
    "zensical>=0.0.74",
    "mkdocstrings[python]>=1.0.8",
    # scripts/build_docs.py converts the jupytext notebooks to .ipynb for
    # mystmd, builds both halves and checks their links.
    "jupytext>=1.16",
    "cyclopts>=4",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "gridax-workspace[dev,test]",
]

[tool.pytest.ini_options]
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["tests", "packages/gridax/tests"]
xfail_strict = true
addopts = "--strict-markers"
# Tiers (see tests/conftest.py).  Unmarked tests are the fast tier.
markers = [
    "slow: correct but expensive (> ~1 s): convergence sweeps, large grids, high-order gradients, solver builds",
    "integration: end-to-end runs (example scripts, plugin worked example, full time integrations)",
]

[tool.ruff]
fix = false
line-length = 88
target-version = "py312"
exclude = ["docs/", "notebooks/"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "PLE",    # pylint errors
    "PLR",    # pylint refactor
    "PLW",    # pylint warnings
    "PIE",    # misc lints
    "PYI",    # flake8-pyi
    "TID",    # tidy imports
    "ISC",    # implicit string concatenation
    "RUF",    # ruff-specific rules
]
ignore = [
    "E402",     # module level import not at top of file
    "E731",     # do not assign a lambda expression, use a def
    "E501",     # line too long (handled by formatter)
    "S101",     # use of assert
    "F722",     # syntax error in forward annotation
    "E741",     # ambiguous variable name
    "E743",     # ambiguous function name
    "F821",     # undefined name (false positives with jaxtyping)
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR2004",  # magic value comparison
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "ISC001",   # conflicts with formatter
    "UP037",    # jaxtyping shape strings must remain quoted
    "RUF002",   # ambiguous unicode characters in docstrings
    "RUF022",   # __all__ is not sorted (we use logical grouping)
    "RUF046",   # int(round(...)) is intentional
    "PYI061",   # Literal style preference
]
unfixable = ["ERA001", "F841", "T201", "T203"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-return-type = "ignore"
unresolved-import = "ignore"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["gridax"]

[tool.coverage.xml]
output = "reports/coverage.xml"
