[project]
name = "gridax"
version = "0.2.0"
description = "Structured grids and land / ocean masks as data, on NumPy (JAX pytrees when JAX is installed)."
authors = [
    { name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["arakawa", "c-grid", "staggered-grid", "numpy", "jax"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# No jax and no equinox: the classes register as JAX pytrees only when JAX is
# importable. jaxtyping is pure Python and imports JAX lazily.
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "jaxtyping>=0.3.0",
    "geophysix>=0.0.3",
]

[project.optional-dependencies]
# `gridax.solvers`: the spectral, capacitance, masked-operator and multigrid
# solvers. `import gridax` never imports these.
jax = [
    "jax>=0.4.38",
    "jaxlib>=0.4.38",
    "equinox>=0.11.0",
    "lineax>=0.1.0",
    "gaussx>=0.8.1",
    "spectraldiffx>=0.1.2",
]
# `gridax.pipekit`: the Tier-B pipekit Operators over the C-grid primitives;
# `ExplicitStep` steps with integrix.march.
pipekit = [
    "gridax[jax]",
    "pipekit-ops",
    "pipekit-jax",
    "integrix>=0.0.9",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gridax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridax"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv.sources]
# None of these is on PyPI yet (#426); the workspace root pins the same tags.
geophysix = { git = "https://github.com/jejjohnson/geophysix", tag = "v0.0.3" }
spectraldiffx = { git = "https://github.com/jejjohnson/spectraldiffx.git", tag = "0.1.2" }
gaussx = { git = "https://github.com/jejjohnson/gaussx", tag = "v0.8.1" }
integrix = { git = "https://github.com/jejjohnson/integrix", tag = "v0.0.9" }
pipekit-ops = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-ops", tag = "pipekit-ops-v0.2.1" }
pipekit-cycle = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-cycle", tag = "pipekit-ops-v0.2.1" }
pipekit-jax = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-jax", tag = "pipekit-ops-v0.2.1" }
