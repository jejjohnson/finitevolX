[project]
name = "gridax-jax"
version = "0.2.0"
description = "Arakawa C-grid operators in JAX: differences, advection, diffusion, boundary conditions and solvers on gridax grids."
authors = [
    { name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com" },
    { name = "Takaya Uchida", email = "roxyboy.guppy@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["finite-volume", "arakawa", "c-grid", "jax"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.4.38",
    "jaxlib>=0.4.38",
    "jaxtyping>=0.3.0",
    "beartype>=0.20.0",
    "equinox>=0.11.0",
    "scipy>=1.14.0",
    "lineax>=0.1.0",
    "diffrax>=0.6.0",
    "spectraldiffx>=0.1.1",
    "gaussx>=0.6.5",
    "integrix>=0.0.3",
    # Grids and masks as NumPy data (packages/gridax in this workspace).
    "gridax>=0.0.0",
    "geophysix>=0.0.3",
]

[project.optional-dependencies]
pipekit = [
    # Tier-B operator layer, `gridax_jax.pipekit` (pipekit Operators over
    # the C-grid primitives). `import gridax_jax` never imports these.
    "pipekit-ops",
    "pipekit-jax",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gridax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridax_jax"]
