name: CI Tests

# Tiers (tests/conftest.py, pyproject markers):
#   fast        unmarked unit tests
#   integration example scripts / end-to-end runs
#   slow        convergence sweeps, large grids, solver builds
# Every PR runs fast + integration on the full OS x Python matrix and the
# slow tier once (Linux, newest Python); a weekly / manual run executes every
# tier on the whole matrix.  xdist workers peak at ~2 GB RSS each, so keep
# -n at 2 on the 7 GB hosted runners (#327).

on:
  push:
    branches:
      - main
  # no branch filter: stacked PRs (base = another feature branch) are tested too
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests (fast + integration)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: uv run pytest tests packages/gridax/tests -m "not slow" -n 2 --durations=15

      - name: Run tests (every tier)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest tests packages/gridax/tests -n 2 --durations=25

  gridax-numpy-only:
    # gridax must install and run with NumPy alone: this environment has
    # gridax, its declared dependencies and pytest, and no JAX or Equinox.
    name: gridax without JAX (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/gridax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check that JAX is absent
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with . python -c "import importlib.util as u;
          assert u.find_spec('jax') is None and u.find_spec('equinox') is None"

      - name: Run the gridax tests
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with . --with pytest python -m pytest tests -p no:cacheprovider

  slow:
    name: Run Tests (slow tier)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests (slow)
        run: uv run pytest tests packages/gridax/tests -m slow -n 2 --durations=25
