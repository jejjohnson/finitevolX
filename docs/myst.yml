# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: the home page, the theory
# pages, the usage guides, the research notes and the example notebooks. The
# API reference is built separately by Zensical + mkdocstrings and mounted at
# `/reference/`. See `docs/README.md`.
#
# The notebooks are jupytext `.py` files, which mystmd cannot read;
# `scripts/build_docs.py` writes an unexecuted `.ipynb` beside each one
# (gitignored) before this build, and the toc lists those.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built API `site/` on this exact port, then rewrites the resulting localhost
# URLs to the deployed `/reference/` path. Keep the port in sync with API_PORT
# in that script.
# ---------------------------------------------------------------------------
version: 1

project:
  id: finitevolx-docs
  title: finitevolX
  description: Finite volume operators for JAX on Arakawa C-grids.
  github: https://github.com/jejjohnson/gridax
  authors:
    - name: Juan Emmanuel Johnson
    - name: Takaya Uchida
  references:
    api: http://127.0.0.1:8910/
  exclude:
    - README.md
    - api/**
    - design/research/boundaries/plan.md
  toc:
    - file: index.md
